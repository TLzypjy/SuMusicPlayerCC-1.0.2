name: Build SuMusicPlayerCC 1.0.2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-sumusicplayercc
  cancel-in-progress: true

jobs:
  build:
    name: Theos build (iphoneos-arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          # 必须带 --recurse-submodules：theos 通过子模块管理 vendor/include、vendor/lib 等，
          # 缺失会导致 before-all 的 vendor 检查直接报错终止。
          # --shallow-submodules 让子模块也做浅克隆，加快速度。
          sudo git clone --depth=1 --recurse-submodules --shallow-submodules https://github.com/theos/theos.git /opt/theos
          # GitHub Actions macOS 根文件系统只读，无法创建 /theos 软链；
          # 改用 THEOS 环境变量指向 /opt/theos（Theos 原生支持）。
          echo "THEOS=/opt/theos" >> "$GITHUB_ENV"
          echo "PATH=/opt/theos/bin:$PATH" >> "$GITHUB_ENV"
          # 下载最新 iPhoneOS SDK 到 $THEOS/sdks（现代 Theos 用 install-sdk）
          sudo THEOS=/opt/theos GITHUB_TOKEN="$GITHUB_TOKEN" /opt/theos/bin/install-sdk latest

      - name: Build tweak
        run: make CONFIG=release

      - name: Show artifact
        run: ls -lh packages/

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: com.susu.sumusicplayercc_1.0.2_iphoneos-arm64
          path: packages/*.deb
          if-no-files-found: error
