name: Build SuMusicPlayerCC 1.0.2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-sumusicplayercc
  cancel-in-progress: true

jobs:
  build:
    name: Theos build (linux, iphoneos-arm64)
    # macOS runner 按 10 倍扣 Actions 分钟数（免费额度已耗尽），
    # Theos 官方支持在 Linux 上交叉编译 iOS，ubuntu runner 按 1 倍计费。
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos + toolchain + SDK + ldid
        # Linux 上的 Theos 需要单独安装交叉工具链，来源与官方 install-theos
        # 脚本一致（L1ghtmann/llvm-project 的 iOSToolchain-x86_64）。
        # 不用 install-theos 脚本本身：其 apt 依赖列表里的 libxml2 在
        # ubuntu-latest 镜像上无安装候选会直接失败。
        run: |
          git clone --depth=1 --recurse-submodules --shallow-submodules \
            https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "PATH=$HOME/theos/bin:$PATH" >> "$GITHUB_ENV"
          curl -sL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz \
            | tar -xJf - -C "$HOME/theos/toolchain/"
          THEOS="$HOME/theos" "$HOME/theos/bin/install-sdk" latest
          mkdir -p "$HOME/.local/bin"
          curl -L https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64 \
            -o "$HOME/.local/bin/ldid"
          chmod +x "$HOME/.local/bin/ldid"
          echo "PATH=$HOME/.local/bin:$PATH" >> "$GITHUB_ENV"
          "$HOME/theos/toolchain/linux/iphone/bin/clang" --version | head -n 1

      - name: Build tweak
        # Theos 的 `make all` 只编译 tweak dylib；deb 包需要 `make package` 才会生成到
        # packages/ 目录（package 依赖 all，会自动先完成编译）。
        run: make CONFIG=release package

      - name: Repack deb for roothide
        # 目标设备为 roothide：dpkg 对 var/jb/usr/... 路径解压失败，而
        # var/jb/Library/... 正常；TweakLoader 只扫 jbroot 物理路径下的
        # usr/lib/TweakInject。make 后重打 deb，把 data 包中 var/jb/private/...
        # 条目（layout 的 jbroot 物理路径，被 rootless scheme 加了前缀）剥成
        # private/...，直达 <jbroot>/usr/lib/TweakInject。
        run: python3 scripts/repack_jbroot.py packages/*.deb

      - name: Show artifact
        run: ls -lh packages/

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: com.susu.sumusicplayercc_1.0.2_iphoneos-arm64
          path: packages/*.deb
          if-no-files-found: error
